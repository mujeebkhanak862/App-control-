name: Build APK from ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project if zip exists
        run: |
          zip=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
          if [ -n "$zip" ]; then echo "Unzipping $zip"; mkdir -p _src && unzip -oq "$zip" -d _src; fi

      - name: Find Gradle project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          [ -n "$f" ] || { echo "settings.gradle not found"; exit 1; }
          echo "GRADLE_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Android SDK licenses and platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$GRADLE_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          cd "$GRADLE_DIR"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ControlHub-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
